:root{--slate:#1F2737;--deep:#161C27;--glass:#A8D5C8;--warm:#F3F1EC;--soft:#C4CCD8}
*{box-sizing:border-box}
html,body{margin:0;background:var(--deep);color:var(--warm);font:400 16px/1.5 "Work Sans",system-ui,sans-serif}
.player{position:relative;width:100%;max-width:1600px;margin:0 auto;aspect-ratio:16/9;background:var(--slate);overflow:hidden;border-radius:clamp(0px,1.6vw,22px)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.big-play{position:absolute;inset:0;display:grid;place-items:end end;padding:0 8.4% 14% 0;background:transparent;border:0;cursor:pointer;color:var(--warm);font:inherit}
.big-play span{display:inline-flex;align-items:center;gap:.8rem;font-weight:700;font-size:clamp(.95rem,1.6vw,1.2rem);padding:.95rem 1.5rem .95rem 1.2rem;border-radius:999px;background:rgba(243,241,236,.08);color:var(--warm);border:1.5px solid rgba(168,213,200,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.big-play span svg{color:var(--glass)}
.big-play:hover span{background:var(--glass);color:#1A2230}.big-play:hover span svg{color:#1A2230}
.big-play svg{width:1.3em;height:1.3em}
.big-play[hidden]{display:none}
.bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:.6rem;padding:.6rem .9rem;background:linear-gradient(transparent,rgba(20,26,38,.75));opacity:0;transition:opacity .25s}
.player:hover .bar,.player:focus-within .bar,.player.paused .bar{opacity:1}
.ctl{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:50%;border:1.5px solid rgba(243,241,236,.5);background:transparent;color:var(--warm);cursor:pointer}
.ctl:hover{background:rgba(243,241,236,.12)}
.ctl svg{width:1.1rem;height:1.1rem}
input[type=range]{flex:1;accent-color:var(--glass);height:2rem;cursor:pointer}
.time{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--soft);min-width:5.5rem;text-align:right}
:focus-visible{outline:3px solid var(--glass);outline-offset:2px}
.below{max-width:1600px;margin:.8rem auto 0;padding:0 .25rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;color:var(--soft);font-size:.95rem}
details summary{cursor:pointer;color:var(--warm);font-weight:700}
details ol{margin:.6rem 0 0;padding-left:1.2rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
